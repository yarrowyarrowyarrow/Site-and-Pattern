<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#101815;color:#dfe;font:13px system-ui}
iframe{width:900px;height:600px;border:0;display:block}
#out{padding:8px;white-space:pre;font-family:ui-monospace,monospace}</style>
</head><body>
<div id="out">measuring…</div>
<iframe id="v" src="scene3d.html"></iframe>
<script>
// Render-level accuracy check for the V2.88 fixes (dev page + the harness behind
// tests/test_accuracy_render.py). Those fixes were the viewer reading the wrong
// number — a flower cluster's size for each flower in it, the plant's real height
// for flowers on a body drawn shorter, a reed's floor for a duckweed, the thorax
// colour for a bee's recorded bands — and every part-level check passed while
// they were wrong, because each part was built correctly.
//
// The cases arrive in the URL FRAGMENT as JSON, built by the test from the real
// catalogue through src/scene_contract.build_scene, so this page measures what
// the app would send and holds no copy of the data to drift:
//
//   { plants: [{ name, month, plant }], bees: [{ name, app }],
//     birds: [{ name, app, size }] }
//
// For each plant it pushes a one-plant scene in the plant's bloom month and reads
// window.permaMeasure — the union box, and per mesh its extent and instance scale
// (a floret is built 1.0 across, so its scale IS its drawn diameter). For each
// bee it builds the baked bee with window.glbCritter and reads back the tergite
// rings, their colours and the generic Band shells. The answer goes into
// document.title as JSON, so a headless `--dump-dom` run can read it without CDP.
let CASES = null;
try {
  CASES = JSON.parse(decodeURIComponent(location.hash.slice(1)));
} catch (e) { CASES = null; }
const out = document.getElementById('out');

function scene(c) {
  const B = { min_x: -5, min_y: -5, max_x: 5, max_y: 5 };
  return {
    // A light case (V2.94) brings the scene's own sun, and bounds wide enough
    // for the shadow map to cover a whole tree: the viewer fits it to them.
    version: 1, year: c.year ?? 30, month: c.month || 7, is_night: false,
    origin: { lat: 51.05, lng: -114.07 }, bounds: c.bounds || B, boundary: null,
    sun: c.sun || { azimuth_deg: 200, altitude_deg: 48 },
    buildings: [], structures: c.structures || [], scan_points: [], splat: null,
    terrain: null,
    // A case is one plant at the origin, or (V2.89) a whole group as the
    // scene built it — a vine and the shrub it climbs, or (V2.90) a plant
    // and the pond it floats on.
    plants: c.plants || [Object.assign({}, c.plant, { plant_id: 1, x: 0, y: 0 })],
  };
}

// One baked bee, taken apart: which rings it wears, in what colours, and
// whether the three generic shells the rings replace are still showing.
function beeReport(w, b) {
  const g = w.glbCritter('bee', b.app);
  if (!g) return { name: b.name, built: false };
  const r = { name: b.name, built: true, tergites: [], bands: [], tip: null };
  g.traverse((o) => {
    const t = /Tergite(\d+)$/.exec(o.name || '');
    if (t) r.tergites.push({
      i: +t[1], colour: '#' + o.material.color.getHexString(),
      on_abdomen: !!(o.parent && /Abdomen$/.test(o.parent.name)),
      visible: o.visible });
    const band = /Band(\d)$/.exec(o.name || '');
    if (band) r.bands.push({ i: +band[1], visible: o.visible });
    if (/Tip$/.test(o.name || '') && o.isMesh)
      r.tip = '#' + o.material.color.getHexString();
  });
  r.tergites.sort((a, b) => a.i - b.i);
  r.bands.sort((a, b) => a.i - b.i);
  return r;
}

// A bird as the scene draws it (V2.97, F174): its baked build, scaled to life by
// its recorded wingspan as rebuildWildlife does, then settled with its wings
// folded. V2.46 sized birds by the width of models whose wings were paddles, and
// checked the width it set, not the length that came with it: every bird was
// drawn about 2.4 times its length. `span_m` is the whole model's width, hidden
// spread wings and all (what the scaling measures); length and height are the
// body that shows, nose to tail along -z and feet to crown.
function birdReport(w, b) {
  const g = w.glbCritter('bird', b.app);
  if (!g) return { name: b.name, built: false };
  w.scaleCritterToLife(g, b.size);
  // Guarded so that a viewer from before the folded wings reports its numbers
  // (and fails on them) instead of stopping the page.
  if (typeof w._wingState === 'function') w._wingState(g, false);
  g.updateMatrixWorld(true);
  const all = new w.THREE.Box3().setFromObject(g), shown = new w.THREE.Box3();
  g.traverseVisible((m) => { if (m.isMesh) shown.expandByObject(m); });
  const s = shown.getSize(new w.THREE.Vector3());
  const wings = (g.userData.wings || []).map((x) => x.pivot.visible);
  const folds = (g.userData.folds || []).map((x) => x.visible);
  const r3 = (v) => Math.round(v * 1000) / 1000;
  return { name: b.name, built: true, build: b.app.build,
           span_m: r3(all.max.x - all.min.x), length_m: r3(s.z), height_m: r3(s.y),
           folded: folds.length > 0 && folds.every(Boolean) && !wings.some(Boolean) };
}

// How a crown is LIT (V2.94, F186). From a person's height, leaves seen from
// their shaded side rendered near-black, and every geometry check passed, since
// the geometry was right. A case with `light` is photographed at 1.6 m from the
// side away from the sun and from the side facing it, and each frame again with
// only the plant in it, unlit white on black, both faces: the mask. Brightness is
// the sRGB luma of the plant's own pixels; near-black is under 0.12. Evaluated in
// the viewer's realm, where camera, scene and the rest are script globals.
//
// Whether a crown's baked shade is DRAWN (V2.96, F188). The shrub layer asked
// for its leaves without vertex colours, so no shrub ever showed the shade baked
// into its model, and nothing failed: the geometry carried it. A case with
// `shade` is photographed from above as drawn, and again with its shrub
// foliage's colour attribute made white. If the shade is drawn, they differ.
const LOOK_SRC = `(function (shots, px) {
  const amp = windUniforms.uWindAmp.value;
  windUniforms.uWindAmp.value = 0;          // the mask must be the same geometry
  const prev = new THREE.Vector2(), size = new THREE.Vector2();
  renderer.getSize(prev);
  const prevAspect = camera.aspect, gl = renderer.getContext();
  renderer.setSize(px, px, false);
  camera.aspect = 1; camera.updateProjectionMatrix();
  const grab = () => {
    renderer.render(scene, camera);
    renderer.getDrawingBufferSize(size);
    const buf = new Uint8Array(size.x * size.y * 4);
    gl.readPixels(0, 0, size.x, size.y, gl.RGBA, gl.UNSIGNED_BYTE, buf);
    return buf;
  };
  // The shrub archetypes' leaf geometry is instanced as it is cached, so the
  // plant's foliage mesh wears it; its colours are put back after the shot.
  const whiten = () => {
    const leaves = new Set([...SHRUB_CACHE.values()].map((a) => a.foliageGeo));
    const saved = new Map();
    plantsGroup.traverse((o) => {
      const c = o.isMesh && leaves.has(o.geometry) && o.geometry.getAttribute('color');
      if (!c || saved.has(c)) return;
      saved.set(c, c.array.slice());
      const a = c.array;
      a.fill(a instanceof Uint8Array ? 255 : a instanceof Uint16Array ? 65535 : 1);
      c.needsUpdate = true;
    });
    return () => saved.forEach((a, c) => { c.array.set(a); c.needsUpdate = true; });
  };
  const white = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
  const shot = (s) => {
    camera.position.set(s.at[0], s.at[1], s.at[2]);
    controls.target.set(s.to[0], s.to[1], s.to[2]); controls.update();
    const undo = s.white ? whiten() : null;
    const img = grab(), hid = [];
    if (undo) undo();
    scene.traverse((o) => {
      if (!(o.isMesh || o.isPoints || o.isSprite || o.isLine) || !o.visible) return;
      let q = o;
      while (q && q !== plantsGroup) q = q.parent;
      // A plant's meshes name it for the tooltip; its contact shadow does not.
      if (!q || !(o.userData && o.userData.pick)) { hid.push(o); o.visible = false; }
    });
    const bg = scene.background, fog = scene.fog;
    scene.background = new THREE.Color(0x000000); scene.fog = null;
    scene.overrideMaterial = white;
    const mask = grab();
    scene.overrideMaterial = null; scene.background = bg; scene.fog = fog;
    hid.forEach((o) => { o.visible = true; });
    let n = 0, sum = 0, dark = 0;
    for (let i = 0; i < img.length; i += 4) {
      if (Math.max(mask[i], mask[i + 1], mask[i + 2]) <= 8) continue;
      const l = (0.2126 * img[i] + 0.7152 * img[i + 1] + 0.0722 * img[i + 2]) / 255;
      n++; sum += l; if (l < 0.12) dark++;
    }
    return { px: n, luma: n ? +(sum / n).toFixed(4) : 0, dark: n ? +(dark / n).toFixed(4) : 0 };
  };
  const out = {};
  for (const s of shots) out[s.name] = shot(s);
  white.dispose();
  renderer.setSize(prev.x, prev.y, false);
  camera.aspect = prevAspect; camera.updateProjectionMatrix();
  windUniforms.uWindAmp.value = amp;
  return out;
})`;
// Where the camera stands, for a plant at the origin: a person's eye (1.6 m) on
// a compass bearing (scene north is -z), or above, as the V2.87 audit looked.
function reach(p) {
  const H = Math.max(0.3, p.height_m), C = Math.max(0.3, p.canopy_m);
  return { H, D: Math.max(3, H * 1.25 + C * 0.5) };
}
function eyeShot(name, p, bearing) {
  const { H, D } = reach(p), a = bearing * Math.PI / 180;
  const ty = Math.min(H * 0.55, 1.6 + 0.35 * (H - 1.6));
  return { name, at: [Math.sin(a) * D, 1.6, -Math.cos(a) * D], to: [0, ty, 0] };
}
function aboveShot(name, p, white) {
  const { H, D } = reach(p);
  return { name, white, at: [D * 0.55, H * 0.5 + D * 0.9, D * 0.55], to: [0, H * 0.5, 0] };
}
function lightReport(w, c) {
  return w.eval(LOOK_SRC)([eyeShot('shaded', c.plant, c.sun.azimuth_deg + 180),
                           eyeShot('sunny', c.plant, c.sun.azimuth_deg)], 256);
}
function shadeReport(w, c) {
  return w.eval(LOOK_SRC)([aboveShot('drawn', c.plant, false),
                           aboveShot('white', c.plant, true)], 256);
}

const result = { models: false, plants: [], bees: [], birds: [] };
// Every viewer function this page calls, across the chunks that define them,
// and the last chunk to load (V2.93), without which a cactus is a herb mat.
const NEEDS = ['permaSetScene', 'permaMeasure', 'permaModelsReady',
               'floretsApply', 'glbCritter', 'buildSucculents'];
let i = 0, waited = 0, booting = 0;

function finish() {
  document.title = 'ACCURACY ' + JSON.stringify(result);
  out.textContent = result.plants.map((p) => {
    const fl = p.parts.filter((q) => q.part === 'floret');
    return p.name.padEnd(22) + ' height ' + p.height_m
      + (fl.length ? '  floret ' + Math.max(...fl.map((q) => q.s_med || 0))
         + ' m, top ' + Math.max(...fl.map((q) => q.top)) : '  no florets');
  }).concat(result.bees.map((b) => b.name.padEnd(22) + ' '
    + (b.built ? b.tergites.map((t) => t.colour).join(' ') || 'generic bands'
               : 'not built'))).concat(result.birds.map((b) => b.name.padEnd(22)
    + (b.built ? ' span ' + b.span_m + ' m, length ' + b.length_m + ' m, height '
                 + b.height_m + ' m' : ' not built'))).join('\n');
}

function step() {
  if (!CASES) {
    out.textContent = 'No cases. This page is driven by '
      + 'tests/test_accuracy_render.py, which passes them in the URL fragment.';
    document.title = 'ACCURACY {"error":"no cases"}';
    return;
  }
  const w = document.getElementById('v').contentWindow;
  if (w && w.permaBootError) {                  // no WebGL here: not a failure
    document.title = 'ACCURACY ' + JSON.stringify({ skip: 'the viewer could '
      + 'not start: ' + String(w.permaBootError).replace(/<[^>]*>/g, ' ') });
    return;
  }
  // Wait for EVERY chunk this page measures, not just the first hooks: the
  // chunks load one after another, 09-models.js starts fetching the models when
  // it evaluates, and 15-florets.js arrives six chunks later. On a fast model
  // load the first plant was pushed before florets existed and silently got the
  // billboard, which read as "no florets" one run in five. A chunk that never
  // arrives is reported, so the test fails instead of skipping.
  const missing = !w || !w.document ? NEEDS
    : NEEDS.filter((f) => typeof w[f] !== 'function');
  if (missing.length || w.document.readyState !== 'complete') {
    if ((booting += 250) > 30000) {
      document.title = 'ACCURACY ' + JSON.stringify({ error: 'the viewer never '
        + 'finished loading; missing ' + (missing.join(', ') || 'the load event') });
      return;
    }
    setTimeout(step, 250);
    return;
  }
  // Measure the baked models the app ships, not the procedural fallback that
  // stands in while they load. Give up waiting after 20 s and say so: the bee
  // needs the models, the plant checks do not.
  if (i === 0 && !w.permaModelsReady() && waited < 20000) {
    waited += 250; setTimeout(step, 250); return;
  }
  result.models = !!w.permaModelsReady();
  if (i < CASES.plants.length) {
    const c = CASES.plants[i++];
    w.permaSetScene(scene(c));
    setTimeout(() => {
      const m = w.permaMeasure();
      const r = { name: c.name, height_m: m.height_m || 0, parts: m.parts || [] };
      if (c.light) r.light = lightReport(w, c);
      if (c.shade) r.shade = shadeReport(w, c);
      result.plants.push(r);
      step();
    }, 600);
    return;
  }
  for (const b of CASES.bees || []) result.bees.push(beeReport(w, b));
  for (const b of CASES.birds || []) result.birds.push(birdReport(w, b));
  finish();
}
step();
</script></body></html>

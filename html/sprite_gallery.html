<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site &amp; Pattern — 3D Sprite Gallery</title>
<!--
  A developer/inspection gallery for the 3D viewer's plant-body archetypes and
  flower sprites. It embeds the REAL viewer (scene3d.html) in an iframe and feeds
  it pre-generated scenes (one specimen per sprite) via window.permaSetScene —
  so every archetype renders exactly as it does in the app, with zero builder
  duplication.

  Scenes come from html/sprite_gallery_scenes.json, produced by
  scripts/make_gallery_scene.py. Serve over http and open this file, e.g.:
      python -m http.server 8000     (from the repo root)
      → http://localhost:8000/html/sprite_gallery.html
-->
<style>
  :root {
    --bg: #16221a; --panel: #1e2e22; --border: #2e4a36;
    --dim: #8fae97; --green: #a5d6a7; --hot: #2e5a36;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; height: 100vh; background: var(--bg);
    color: var(--green); font: 14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  #sidebar {
    width: 270px; flex: 0 0 270px; height: 100%; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--border); padding: 14px 12px;
  }
  #sidebar h1 { font-size: 15px; margin: 2px 4px 2px; color: var(--green); }
  #sidebar .sub { font-size: 11px; color: var(--dim); margin: 0 4px 12px; }
  .group-label {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--dim); margin: 14px 4px 6px; border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
  }
  .item {
    display: block; width: 100%; text-align: left; cursor: pointer;
    background: transparent; color: var(--green); border: 1px solid transparent;
    border-radius: 6px; padding: 6px 9px; margin: 2px 0; font-size: 13px;
  }
  .item:hover { background: #243a2b; }
  .item.active { background: var(--hot); border-color: var(--border); color: #eafaea; }
  #stage { position: relative; flex: 1 1 auto; height: 100%; }
  #viewer { width: 100%; height: 100%; border: 0; display: block; background: #0e1611; }
  #caption {
    position: absolute; left: 16px; bottom: 16px; max-width: 60%;
    background: rgba(20,32,24,.86); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 13px; backdrop-filter: blur(3px);
  }
  #caption .name { font-size: 15px; font-weight: 600; color: #eafaea; }
  #caption .desc { font-size: 12.5px; color: var(--green); margin-top: 3px; }
  #caption .ex { font-size: 12px; color: var(--dim); margin-top: 4px; }
  #toolbar { position: absolute; right: 14px; top: 12px; display: flex; gap: 8px; }
  #toolbar button {
    background: var(--panel); color: var(--green); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
  }
  #toolbar button:hover { background: #243a2b; }
  #status {
    position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--dim); font-size: 14px;
    pointer-events: none; text-align: center; padding: 0 20px;
  }
  /* ~480 entries once every seeded species is listed, so the list needs a
     filter to be usable at all. */
  #search {
    width: 100%; box-sizing: border-box; margin: 6px 0 4px; padding: 6px 8px;
    background: #16211a; color: #e8f0e4; border: 1px solid #2e4a34;
    border-radius: 5px; font: inherit;
  }
  #search::placeholder { color: #7d8f77; }
  /* Contact sheet: every sprite at once, each drawn by the real viewer and
     framed to its own plant. A one-at-a-time menu cannot show you that two
     sprites are the same sprite — which is the main thing you want to know. */
  #sheet {
    position: absolute; inset: 0; overflow-y: auto; background: #0e1611;
    padding: 12px 14px 40px; display: none; z-index: 5;
  }
  #sheet.on { display: block; }
  #sheet-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .tile {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; cursor: pointer; padding: 0;
  }
  .tile:hover { border-color: #6ba46f; }
  .tile img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover;
              background: #0b120d; }
  .tile .cap {
    font-size: 11.5px; color: var(--green); padding: 5px 7px 6px;
    text-align: left; line-height: 1.3;
  }
  .tile .cap .sci { color: var(--dim); font-size: 10.5px; font-style: italic; }
  .sheet-head {
    grid-column: 1 / -1; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--dim); margin: 10px 2px 0;
    border-bottom: 1px solid var(--border); padding-bottom: 3px;
  }
  #sheet-status { color: var(--dim); font-size: 12.5px; margin: 0 2px 10px; }
</style>
</head>
<body>
  <div id="sidebar">
    <h1>3D Sprite Gallery</h1>
    <div class="sub">Every plant-body archetype, flower sprite and seeded species
      the viewer can render. Drag to orbit · scroll to zoom.</div>
    <input id="search" type="search" placeholder="Search name or Latin…"
           oninput="onFilter(this.value)" autocomplete="off">
    <div id="menu"></div>
  </div>
  <div id="stage">
    <iframe id="viewer" src="scene3d.html" title="3D viewer"></iframe>
    <div id="sheet">
      <div id="sheet-status"></div>
      <div id="sheet-grid"></div>
    </div>
    <div id="toolbar">
      <button id="sheet-btn">▦ Contact sheet</button>
      <button id="reset">Reset view</button>
    </div>
    <div id="caption" style="display:none">
      <div class="name"></div><div class="desc"></div><div class="ex"></div>
    </div>
    <div id="status">Loading 3D viewer…</div>
  </div>

<script>
const viewer = document.getElementById('viewer');
const statusEl = document.getElementById('status');
const captionEl = document.getElementById('caption');
let SCENES = null, currentKey = null, viewerReady = false;

function vwin() { try { return viewer.contentWindow; } catch (e) { return null; } }
function ready() { const w = vwin(); return !!(w && typeof w.permaSetScene === 'function'); }

async function init() {
  try {
    SCENES = await (await fetch('sprite_gallery_scenes.json', { cache: 'no-store' })).json();
  } catch (e) {
    statusEl.textContent = 'Could not load sprite_gallery_scenes.json — run '
      + 'scripts/make_gallery_scene.py and serve over http.';
    return;
  }
  buildMenu();
  waitForViewer();
}

// Headings come from each entry's own `group` (src/sprite_gallery.py), so the
// menu never has to sniff key prefixes — which stopped working the moment "every
// seeded species" made this a ~480-entry list. Hence the search box too.
function buildMenu(filter) {
  const menu = document.getElementById('menu');
  menu.textContent = '';
  const needle = (filter || '').trim().toLowerCase();

  const addItem = (k) => {
    const b = document.createElement('button');
    b.className = 'item'; b.dataset.key = k; b.textContent = SCENES[k].name || k;
    b.onclick = () => show(k);
    menu.appendChild(b);
  };
  const addGroup = (label) => {
    const d = document.createElement('div'); d.className = 'group-label';
    d.textContent = label; menu.appendChild(d);
  };
  // The scientific name is in `example`, so searching "Populus" finds the aspens
  // even though every label is a common name.
  const matches = (e) => !needle || [e.name, e.example, e.desc]
    .join(' ').toLowerCase().includes(needle);

  let group = null, shown = 0;
  for (const k of Object.keys(SCENES)) {
    const e = SCENES[k];
    if (!matches(e)) continue;
    if (e.group && e.group !== group) { group = e.group; addGroup(e.group); }
    addItem(k);
    shown++;
  }
  if (!shown) addGroup('no sprite matches that search');
  return shown;
}

function onFilter(text) {
  buildMenu(text);
  // In sheet mode the search narrows the SHEET (type "rosa", get every rose side
  // by side); in single view it just jumps to the first hit as before.
  if (sheetOn) { setSheet(true); return; }
  const first = document.querySelector('#menu .item');
  if (first) show(first.dataset.key);
}

function waitForViewer() {
  let waited = 0;
  const tick = () => {
    if (ready()) {
      viewerReady = true;
      statusEl.style.display = 'none';
      // ?sprite=KEY deep-links a specimen (used by the screenshot tool); else
      // open the full grid.
      const q = new URLSearchParams(location.search);
      const want = q.get('sprite');
      const start = (want && SCENES[want]) ? want
        : (currentKey || (SCENES.all ? 'all' : Object.keys(SCENES)[0]));
      show(start);
      // ?sheet=1 opens straight into the contact sheet; ?q= pre-fills the
      // search, so ?sheet=1&q=rosa is "every rose, side by side" as a link.
      const pre = q.get('q');
      if (pre) { document.getElementById('search').value = pre; buildMenu(pre); }
      if (q.get('sheet')) setSheet(true);
      return;
    }
    waited += 200;
    if (waited > 12000) {
      statusEl.textContent = '3D viewer did not start (WebGL unavailable in this browser?). '
        + 'The viewer iframe shows the underlying error.';
      return;
    }
    setTimeout(tick, 200);
  };
  tick();
}

function show(key) {
  if (!key || !SCENES[key]) return;
  // Picking from the sidebar means "show me this one" — leave the sheet, and
  // stop its render loop so it stops pushing scenes over the top of this one.
  if (sheetOn) { sheetOn = false; sheetRun++; sheetEl.classList.remove('on');
                 sheetBtn.textContent = '▦ Contact sheet'; }
  currentKey = key;
  document.querySelectorAll('.item').forEach(el =>
    el.classList.toggle('active', el.dataset.key === key));
  const entry = SCENES[key];
  captionEl.style.display = 'block';
  captionEl.querySelector('.name').textContent = entry.name || key;
  captionEl.querySelector('.desc').textContent = entry.desc || '';
  captionEl.querySelector('.ex').textContent =
    entry.example ? ('Example plant: ' + entry.example) : '';
  if (viewerReady && ready()) vwin().permaSetScene(entry.scene);
}

document.getElementById('reset').onclick = () => {
  const w = vwin();
  if (w && typeof w.permaResetView === 'function') w.permaResetView();
};

// ── Contact sheet ───────────────────────────────────────────────────────────
// Push each specimen into the real viewer, snapshot it (window.permaSnapshot),
// and drop the thumbnail into a grid. Slower than a static sheet of pre-rendered
// images, but nothing can drift: every tile IS the viewer, so the sheet always
// shows the geometry, materials, season and quality level the app would draw.
// Honours the sidebar search, so "rosa" gives a sheet of just the roses.
const sheetEl = document.getElementById('sheet');
const sheetGrid = document.getElementById('sheet-grid');
const sheetStatus = document.getElementById('sheet-status');
const sheetBtn = document.getElementById('sheet-btn');
let sheetOn = false, sheetRun = 0;
const THUMB_PX = 300;

// Yield to the browser so the progress line paints and the tab stays alive.
// NOT requestAnimationFrame: permaSetScene builds the scene and frames the
// camera synchronously, and permaSnapshot calls renderer.render itself, so
// there is nothing to wait for a frame for — waiting two rAFs per tile made the
// sheet about eight times slower for no change in the picture.
function yieldToUI() { return new Promise(r => setTimeout(r, 0)); }

async function buildSheet(keys) {
  const run = ++sheetRun;                    // cancels any in-flight sheet
  sheetGrid.textContent = '';
  const w = vwin();
  if (!w || typeof w.permaSnapshot !== 'function') {
    sheetStatus.textContent = 'This viewer build has no permaSnapshot hook.';
    return;
  }
  // Baked GLB archetypes load asynchronously and rebuild the scene when they
  // land. Snapshotting before that yields a sheet of the procedural FALLBACK
  // geometry that looks like a finished answer — wait for them.
  for (let i = 0; i < 100 && w.permaModelsReady && !w.permaModelsReady(); i++) {
    sheetStatus.textContent = 'Waiting for the 3D models to load…';
    await new Promise(r => setTimeout(r, 100));
  }
  let group = null, done = 0;
  for (const k of keys) {
    if (run !== sheetRun) return;            // superseded
    const e = SCENES[k];
    if (e.group && e.group !== group) {
      group = e.group;
      const hd = document.createElement('div');
      hd.className = 'sheet-head'; hd.textContent = group;
      sheetGrid.appendChild(hd);
    }
    w.permaSetScene(e.scene);
    const url = w.permaSnapshot({ width: THUMB_PX, height: THUMB_PX });
    const tile = document.createElement('button');
    tile.className = 'tile';
    const img = document.createElement('img');
    img.src = url; img.alt = e.name || k; img.loading = 'lazy';
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.textContent = e.name || k;
    if (e.example) {
      const sci = document.createElement('div');
      sci.className = 'sci'; sci.textContent = e.example;
      cap.appendChild(sci);
    }
    tile.append(img, cap);
    tile.onclick = () => { setSheet(false); show(k); };
    sheetGrid.appendChild(tile);
    done++;
    sheetStatus.textContent = `${done} / ${keys.length} rendered`
      + (done < keys.length ? ' …' : ' · click any tile to open it');
    if (done % 8 === 0) await yieldToUI();
  }
}

function setSheet(on) {
  sheetOn = on;
  sheetEl.classList.toggle('on', on);
  sheetBtn.textContent = on ? '◧ Single view' : '▦ Contact sheet';
  captionEl.style.display = on ? 'none' : 'block';
  if (on) {
    const needle = (document.getElementById('search').value || '')
      .trim().toLowerCase();
    const keys = Object.keys(SCENES).filter(k => {
      if (k === 'all') return false;         // the grid scene is not a specimen
      const e = SCENES[k];
      return !needle || [e.name, e.example, e.desc].join(' ')
        .toLowerCase().includes(needle);
    });
    sheetStatus.textContent = `Rendering ${keys.length} sprites…`;
    buildSheet(keys);
  } else {
    sheetRun++;                              // stop any in-flight render
    if (currentKey) show(currentKey);        // restore the single view
  }
}

sheetBtn.onclick = () => setSheet(!sheetOn);

init();
</script>
</body>
</html>

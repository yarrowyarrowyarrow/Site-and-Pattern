<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Site &amp; Pattern Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet 1.9.4 + Leaflet.draw 1.0.4, vendored (V2.83). These came from
       a CDN until then, so with no internet the page loaded with no `L`
       and the whole design surface was dead: no boundary, no placement, no
       overlays. Tiles still need the network; the map itself no longer does.
       See html/vendor/README.md, and tests/test_map_vendor.py. -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/leaflet-draw/leaflet.draw.css" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; }
    #map { width: 100%; height: 100%; }

    .plant-marker-label {
      /* 0.92, not 0.85: its grey second line holds 6.3:1 over the yard or a
         white tile, where it had been 3.6-4.1:1 (V3.03). */
      background: rgba(30, 40, 30, 0.92);
      border: 1px solid #5a8a5a;
      border-radius: 4px;
      color: #c8e6c9;
      font-size: 12px;
      padding: 2px 6px;
      white-space: nowrap;
      pointer-events: none;
    }

    .measure-label {
      background: rgba(253, 216, 53, 0.9);
      border: 1px solid #f9a825;
      border-radius: 4px;
      color: #1a1a2e;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 8px;
      white-space: nowrap;
    }

    .annotation-label span {
      background: rgba(30, 40, 30, 0.85);
      border: 1px solid #7cb342;
      border-radius: 4px;
      color: #e8f5e9;
      font-size: 12px;
      padding: 3px 8px;
      white-space: nowrap;
      cursor: move;
    }

    /* ── Map legend ─────────────────────────────────────────────────── */
    #map-legend {
      position: absolute;
      bottom: 30px;
      left: 10px;
      z-index: 1000;
      background: rgba(26, 42, 26, 0.94);
      border: 1px solid #4a7a4a;
      border-radius: 6px;
      padding: 8px 12px;
      color: #c8e6c9;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 12px;
      max-width: 220px;
      /* Scrolls rather than running off a short map (V3.03). */
      max-height: calc(100% - 60px);
      overflow-y: auto;
      display: none;
    }
    #map-legend.visible { display: block; }
    #map-legend h4 {
      margin: 0 0 6px 0;
      font-size: 13px;
      color: #a5d6a7;
      border-bottom: 1px solid #2e4a2e;
      padding-bottom: 4px;
    }
    #map-legend .legend-close {
      float: right; background: none; border: none; color: #c8e6c9;
      font-size: 16px; line-height: 16px; min-width: 24px; min-height: 24px;
      margin: -4px -6px 0 0; cursor: pointer;
    }
    #map-legend .legend-section {
      margin-bottom: 6px;
    }
    #map-legend .legend-section-title {
      font-size: 12px;
      color: #90a4ae;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #map-legend .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 0;
    }
    #map-legend .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    #map-legend .legend-swatch.outline-only {
      background: transparent !important;
      border: 2px dashed;
    }
    #map-legend .legend-note {
      color: #90a4ae;
      margin-top: 2px;
    }
    /* V3.11 (F217): the legend names what is drawn, by 12-legend.js. A
       section's switch sits on its title; a swatch is a plant, an area, a
       line or a ring, as the thing it stands for is drawn. */
    #map-legend .legend-section-title {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    #map-legend .legend-switch { display: inline-flex; text-transform: none; }
    #map-legend .legend-switch button {
      background: none; border: 1px solid #4a7a4a; color: #a5d6a7;
      font: inherit; font-size: 12px; min-height: 24px; padding: 0 6px; cursor: pointer;
    }
    #map-legend .legend-switch button:first-child { border-radius: 4px 0 0 4px; }
    #map-legend .legend-switch button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
    #map-legend .legend-switch button[aria-pressed="true"] {
      background: #2e4a2e; color: #e8f5e9; font-weight: 600;
    }
    #map-legend .legend-swatch.legend-area { border-radius: 2px; }
    #map-legend .legend-swatch.legend-line {
      width: 16px; height: 0; border: none; border-radius: 0;
    }
    #map-legend .legend-num { color: #e8f5e9; }
    #map-legend .legend-count { color: #90a4ae; }
    #map-legend button.legend-name {
      width: 100%; background: none; border: none; color: inherit; font: inherit;
      text-align: left; cursor: pointer; min-height: 24px; border-radius: 3px;
    }
    #map-legend button.legend-name:hover { background: rgba(165, 214, 167, 0.12); }
    /* Only while the pointer is over the legend, so Export PDF's picture of
       the map does not print a pencil beside every name. */
    #map-legend .legend-edit { margin-left: auto; opacity: 0; color: #a5d6a7; }
    #map-legend:hover .legend-edit,
    #map-legend .legend-name:focus-visible .legend-edit { opacity: 1; }
    /* A species' number on each of its plants, with the legend in Species. */
    .sp-species-num {
      color: #fff; font: 700 12px 'Segoe UI', Arial, sans-serif; line-height: 16px;
      text-align: center; white-space: nowrap;
      text-shadow: 0 0 2px #000, 0 0 3px #000, 0 0 1px #000;
    }
    #legend-toggle {
      position: absolute;
      bottom: 30px;
      left: 10px;
      z-index: 1001;
      background: rgba(26, 42, 26, 0.9);
      border: 1px solid #4a7a4a;
      border-radius: 4px;
      color: #a5d6a7;
      font-size: 12px;
      padding: 4px 8px;
      min-height: 24px;
      cursor: pointer;
    }
    #legend-toggle:hover { background: rgba(46, 74, 46, 0.95); }
    #legend-toggle.active { display: none; }

    /* ── Structure labels ───────────────────────────────────────── */
    .structure-label {
      background: rgba(30, 42, 30, 0.88);
      border: 1px solid #78909c;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      padding: 2px 6px;
      white-space: nowrap;
      text-align: center;
    }
    .structure-label .struct-icon {
      font-size: 14px;
    }

    /* ── Hedgerow labels ────────────────────────────────────────── */
    .hedgerow-label {
      background: rgba(30, 50, 30, 0.85);
      border: 1px solid #66bb6a;
      border-radius: 4px;
      color: #c8e6c9;
      font-size: 12px;
      padding: 2px 6px;
      white-space: nowrap;
    }

    /* ── Custom shape labels ────────────────────────────────────── */
    .shape-label {
      background: rgba(30, 42, 30, 0.85);
      border: 1px solid #78909c;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      font-weight: bold;
      padding: 3px 8px;
      white-space: nowrap;
    }

    /* Site search bar moved out of the map — it lives in the Site panel
       (right sidebar) so it no longer obscures the map visual. The
       placeSitePin / clearSitePin JS functions below are still called
       from Python via the QWebChannel after the panel runs geocoding. */
    .site-pin-popup {
      color: #1a1a2e;
      font-size: 12px;
    }

    /* While a placement tool is armed (setMode adds .placing), keep the
       crosshair over interactive layers — shapes, markers — instead of
       Leaflet's default pointer, so hovering one still reads as "click to
       place here". Idle mode keeps the pointer. */
    .leaflet-container.placing .leaflet-interactive { cursor: crosshair !important; }
    /* Idle, over a boundary: it can be pressed to edit it (boundaryHover,
       V3.11). Not while the map is being dragged, which keeps its own hand. */
    body:not(.leaflet-dragging) .leaflet-container.sp-over-boundary { cursor: pointer; }
  </style>
</head>
<body>
  <div id="map"></div>

  <button id="legend-toggle" onclick="toggleLegend()">Legend</button>
  <div id="map-legend">
    <h4>Legend <button class="legend-close" onclick="toggleLegend()" aria-label="Close the legend">&times;</button></h4>
    <!-- Built from what is on the map by html/map/12-legend.js (V3.11). -->
    <div id="legend-body"></div>
  </div>

  <!-- Leaflet JS + Leaflet Draw (vendored; see the note in <head>) -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet-draw/leaflet.draw.js"></script>
  <!-- Qt WebChannel -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

  <script src="map/01-core.js"></script>
  <script src="map/02-boundary.js"></script>
  <script src="map/02b-shape-edit.js"></script>
  <script src="map/03-plants.js"></script>
  <script src="map/04-tools.js"></script>
  <script src="map/05-features.js"></script>
  <script src="map/06-overlays.js"></script>
  <script src="map/07-network.js"></script>
  <script src="map/08-footprint.js"></script>
  <script src="map/09-keyboard.js"></script>
  <script src="map/10-plant-key.js"></script>
  <script src="map/11-map-furniture.js"></script>
  <script src="map/12-legend.js"></script>
</body>
</html>

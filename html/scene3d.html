<!doctype html>
<!--
  html/scene3d.html — Site & Pattern's built-in 3D design viewer (V1.62).

  This file is the SHELL: a canvas, the HUD/overlay DOM, and the ordered list of
  classic scripts at the bottom. All the viewer logic lives in html/scene3d/*.js
  and each chunk documents itself; see docs/3D_ASSETS.md and docs/3D_SPRITES.md
  for the asset and morphology contracts.

  (The 90-line V2.12/V2.13 changelog that used to live here was removed at
  V2.46d, when this file hit its 400-line ceiling. It was a release history, not
  a description of the shell, and every claim in it was better stated in the
  chunk that implements it. `git log` is the changelog.)

  ── The host contract ───────────────────────────────────────────────────────
  The desktop side drives everything through guarded `window.perma*` hooks,
  pinned by tests/test_bridge_contract.py. The core three:

    window.permaSetScene(scene)  — full rebuild from a Scene JSON dict
                                   (src/scene_contract.py, SCENE_VERSION 1;
                                   local metres: +x east, +y north)
    window.permaSetSun(az, alt)  — point the shadow-casting sun
                                   (azimuth deg CW from north, altitude deg)
    window.permaSetPlants(recs)  — legacy per-plant update (lat/lng records
                                   from src/scene3d.py); projected with the
                                   cosLat metric about the last scene origin

  Axis mapping (scene → three.js, Y-up): x_east → +x, y_north → −z,
  height → +y. Every critter model faces −Z (see critterHeading).

  three.js + Spark are vendored under html/vendor/ and served over a localhost
  http:// origin (src/web_assets.py), so the 3D view loads offline and is immune
  to CDN outages. The offline notice appears only if WebGL itself is
  unavailable or the bundled assets are missing.

  ── Load order is dependency order ──────────────────────────────────────────
  The chunks are CLASSIC scripts sharing one global scope, loaded in sequence at
  the bottom of this file. A function called from the animation loop must be
  declared in a chunk that loads before 08-modes.js, or be reached through a
  `typeof` guard — see 08-modes.js:_loopFault for what happens when it is not,
  and tests/test_creature_scale.py:TestTheRenderLoopSurvivesItself, which
  enforces it.
-->
<html>
<head>
<meta charset="utf-8">
<title>Site &amp; Pattern 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; }
  #hud {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    font-family: system-ui, sans-serif; font-size: 13px; color: #1b3a26;
    background: rgba(255,255,255,.82); border-radius: 8px; padding: 7px 12px;
    pointer-events: none; line-height: 1.45;
  }
  #offline {
    position: absolute; inset: 0; display: none; z-index: 10;
    align-items: center; justify-content: center; text-align: center;
    font-family: system-ui, sans-serif; color: #5d4037; background: #efebe9;
  }
  #plant-tip {
    position: absolute; z-index: 6; display: none; pointer-events: none;
    font-family: system-ui, sans-serif; font-size: 12.5px; color: #eafaea;
    background: rgba(20,32,24,.92); border: 1px solid #3a5a3a;
    border-radius: 6px; padding: 3px 8px; white-space: nowrap;
    transform: translate(12px, 12px);
  }
  /* "Fly as a bee" (F37): a UV-goggles tint + soft compound-eye vignette laid
     over the canvas — pointer-events:none so it never blocks look/fly input.
     Deliberately subtle (V2.12): the old stronger tint washed the scene out. */
  #bee-vision {
    position: absolute; inset: 0; z-index: 4; display: none; pointer-events: none;
    background:
      radial-gradient(ellipse 82% 82% at center,
        rgba(60,20,120,0) 52%, rgba(26,6,64,.48) 100%),
      linear-gradient(rgba(70,110,255,.06), rgba(150,70,210,.08));
  }
  #bee-hint {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    z-index: 7; display: none; pointer-events: none;
    font-family: system-ui, sans-serif; font-size: 12.5px; color: #f3e9ff;
    background: rgba(30,12,60,.80); border: 1px solid #6a4ea0;
    border-radius: 8px; padding: 6px 12px; line-height: 1.4; text-align: center;
  }
  /* "Who lives here" roster (V2.13): the wildlife the design's plants support,
     grouped by kind — so you can read the scene without hovering. */
  #wild-roster {
    position: absolute; top: 10px; right: 10px; z-index: 6; display: none;
    max-height: 78%; overflow-y: auto; width: 240px;
    font-family: system-ui, sans-serif; font-size: 12px; color: #eef4ec;
    background: rgba(18,28,20,.86); border: 1px solid #3a5a3a;
    border-radius: 8px; padding: 8px 11px; line-height: 1.4;
  }
  #wild-roster h4 { margin: 0 0 5px; font-size: 12.5px; color: #cfe8c8; }
  #wild-roster .grp { margin-top: 7px; font-weight: 600; color: #b7d8ea; }
  #wild-roster .row { color: #d7e6d2; padding-left: 4px; }
  #wild-roster .on { color: #8fae86; }
  #wild-roster .reach { margin: 2px 0 4px; padding: 4px 6px; font-size: 11.5px;
    color: #eaf6df; background: rgba(90,140,70,.28); border-radius: 5px; }
  #wild-roster .reach b { color: #ffffff; }
  /* Creature speed (F121, V2.54): pause and slow the ambient wildlife so you
     can actually look at one. Bottom-left, clear of the roster (top-right) and
     the bee hint (bottom-centre). Shown only while there are creatures. */
  #wild-speed {
    position: absolute; left: 10px; bottom: 10px; z-index: 7; display: none;
    font-family: system-ui, sans-serif; font-size: 12px; color: #eef4ec;
    background: rgba(18,28,20,.86); border: 1px solid #3a5a3a;
    border-radius: 8px; padding: 5px 7px; line-height: 1.4;
    align-items: center; gap: 4px;
  }
  #wild-speed.on { display: flex; }
  #wild-speed .lbl { color: #cfe8c8; padding: 0 4px 0 2px; }
  #wild-speed button {
    font: inherit; color: #d7e6d2; cursor: pointer;
    background: rgba(90,140,70,.20); border: 1px solid #3a5a3a;
    border-radius: 5px; padding: 2px 8px; min-width: 30px;
  }
  #wild-speed button:hover { background: rgba(90,140,70,.38); }
  /* The current step has to be readable at a glance and not only on hover: a
     silently frozen scene reads as "the app has hung" — the same misdiagnosis
     08-modes.js records for the blank-window bug, where a correct HUD sat over
     a dead scene and looked like a failed build. */
  #wild-speed button.sel {
    color: #10200f; background: #8fc47e; border-color: #b6dfa6; font-weight: 600;
  }
  /* Cinematic flyover (V2.13): letterbox bars + a lower-third caption for the
     hands-free "watch the lawn become habitat" tour. */
  .cine-bar {
    position: absolute; left: 0; right: 0; height: 0; z-index: 8; background: #000;
    pointer-events: none; transition: height .5s ease;
  }
  #cine-top { top: 0; } #cine-bottom { bottom: 0; }
  body.cinematic .cine-bar { height: 8.5%; }
  #cine-cap {
    position: absolute; left: 50%; bottom: 10%; transform: translateX(-50%);
    z-index: 9; display: none; pointer-events: none; text-align: center;
    font-family: system-ui, sans-serif; color: #f4f7f2; letter-spacing: .3px;
    text-shadow: 0 2px 8px rgba(0,0,0,.7);
  }
  #cine-cap .big { font-size: 26px; font-weight: 700; }
  #cine-cap .sub { font-size: 14px; opacity: .9; margin-top: 2px; }

  /* Click-to-inspect card (V2.29) — the learning panel for a clicked plant or
     creature. Scrolls on its own so a long species list never pushes past the
     viewport, and caps its height on short windows. */
  #inspect-card {
    position: absolute; right: 12px; top: 12px; width: 330px; z-index: 12;
    display: none; max-height: calc(100vh - 24px); overflow-y: auto;
    background: rgba(20, 27, 22, .93); color: #eaf1e6; border-radius: 10px;
    padding: 14px 15px 16px; box-shadow: 0 6px 26px rgba(0,0,0,.45);
    font-family: system-ui, sans-serif; font-size: 13px; line-height: 1.45;
    backdrop-filter: blur(3px);
  }
  #inspect-close {
    position: absolute; right: 8px; top: 6px; background: none; border: 0;
    color: #9fb096; font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 5px;
  }
  #inspect-close:hover { color: #eaf1e6; }
  /* Species photo. The caption is not decoration: an open-licensed photo may
     only be shown with its credit, so the two are one <figure> and the caption
     has no state in which it is hidden. */
  #inspect-card .iphoto { margin: 0 0 10px; }
  #inspect-card .iphoto img {
    display: block; width: 100%; height: 148px; object-fit: cover;
    border-radius: 7px; background: #223126;
  }
  #inspect-card .iphoto figcaption {
    margin-top: 4px; font-size: 10px; line-height: 1.35; color: #90a389;
  }
  #inspect-card .ihead { margin-right: 22px; }
  #inspect-card .iname { font-size: 16px; font-weight: 700; }
  #inspect-card .isci { font-style: italic; color: #a9bda2; font-size: 12px; }
  #inspect-card .chips { margin: 8px 0 4px; }
  #inspect-card .chip {
    display: inline-block; margin: 0 4px 4px 0; padding: 2px 7px;
    border-radius: 9px; font-size: 11px; background: #33452f; color: #d6e8cd;
  }
  #inspect-card .chip.good { background: #35533a; color: #cdebd2; }
  #inspect-card .chip.warn { background: #5a3f27; color: #f0d9bd; }
  #inspect-card .ifacts { color: #b7c7b0; font-size: 12px; margin: 4px 0 2px; }
  #inspect-card .isec {
    margin: 12px 0 5px; font-size: 11px; letter-spacing: .5px;
    text-transform: uppercase; color: #93a88b;
  }
  #inspect-card .ilist { list-style: none; margin: 0; padding: 0; }
  #inspect-card .ilist li {
    padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.06);
  }
  #inspect-card .ilist.plain li { border: 0; color: #cbdac4; }
  #inspect-card .ilist .how { color: #9fb096; font-size: 11px; display: block; }
  /* F12 — the citation on an edge. Quiet on purpose: it has to be legible
     without competing with the animal's name, which is what the row is for. */
  #inspect-card .ilist .cite { color: #7d8f77; font-size: 10px; display: block; }
  #inspect-card .isrcs { margin-top: 8px; font-size: 11px; color: #9fb096; }
  #inspect-card .isrcs summary { cursor: pointer; color: #93a88b; }
  #inspect-card .isrcs ul { margin: 6px 0 0; padding-left: 16px; }
  #inspect-card .isrcs li { padding: 2px 0; }
  #inspect-card .isrcs .dim { color: #7d8f77; font-style: italic; }
  #inspect-card .ionly {
    margin-top: 10px; padding: 8px 9px; border-radius: 7px;
    background: rgba(120, 80, 40, .35); font-size: 12px;
  }
  #inspect-card .isrc, #inspect-card .inotes {
    margin-top: 9px; color: #a9bda2; font-size: 11.5px;
  }
  /* season strip: one row per activity, twelve month cells */
  #inspect-card .season { margin: 10px 0 2px; }
  #inspect-card .srow { display: flex; align-items: center; gap: 2px; margin-bottom: 3px; }
  #inspect-card .slab {
    width: 52px; flex: none; font-size: 10.5px; color: #93a88b; text-align: right;
    padding-right: 5px;
  }
  #inspect-card .srow i {
    flex: 1; height: 9px; border-radius: 2px; background: rgba(255,255,255,.09);
    font-style: normal; font-size: 9px; text-align: center; color: #8b9d84;
    line-height: 9px;
  }
  #inspect-card .srow i.nowm { outline: 1px solid #ffe89a; }
  /* growth strip: height at years 1 / 5 / 15 / 25 */
  #inspect-card .grow { margin: 11px 0 2px; }
  #inspect-card .ghead {
    font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
    color: #93a88b; margin-bottom: 4px;
  }
  #inspect-card .growrow { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  #inspect-card .growrow.gnow { color: #ffe89a; }
  #inspect-card .gy { width: 34px; flex: none; font-size: 11px; color: #93a88b; }
  #inspect-card .gbar {
    flex: 1; height: 7px; background: rgba(255,255,255,.08); border-radius: 4px;
  }
  #inspect-card .gbar i { display: block; height: 7px; border-radius: 4px; background: #6f9a55; }
  #inspect-card .growrow.gnow .gbar i { background: #ffe89a; }
  #inspect-card .gv { font-size: 10.5px; color: #a9bda2; white-space: nowrap; }
</style>
</head>
<body>
<div id="hud">3D view — loading…</div>
<div id="plant-tip"></div>
<div id="offline"><div id="offline-msg"><b>3D viewer couldn't start</b><br>
The bundled 3D engine failed to load. The 2D map is unaffected.</div></div>
<div id="wild-roster"></div>
<div id="wild-speed"></div>
<div id="bee-vision"></div>
<div id="bee-hint"></div>
<div id="cine-top" class="cine-bar"></div>
<div id="cine-bottom" class="cine-bar"></div>
<div id="cine-cap"><div class="big"></div><div class="sub"></div></div>
<div id="inspect-card"></div>

<!-- Qt WebChannel (V2.43) — the viewer's first Python channel, used by
     scene3d/16-editing.js to report a click back. The qrc: URL only resolves
     inside QtWebEngine; in a plain browser this 404s and 16-editing.js's
     guards turn every bridge call into a no-op, which is the intended
     degraded behaviour rather than an error. -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/",
    "@sparkjsdev/spark": "./vendor/spark/spark.module.js"
  }
}
</script>

<script>
  // Diagnostic checkpoint ping → the host logs it to ~/permadesign-debug.log,
  // so we can trace how far this page got even when the JS console never
  // reaches Python. Best-effort, never throws.
  window._pinglog = function (m) {
    try { fetch('/__log?m=' + encodeURIComponent(m)); } catch (e) {}
  };
  window._pinglog('page-script-running');
  // Fail loudly, not with a stuck "loading…": if the module graph didn't
  // initialise within 8s (a WebGL failure sets permaBootError; otherwise the
  // vendored three.js module failed to load/parse), say which.
  window.permaFatal = function (msg) {
    document.getElementById('offline-msg').innerHTML = msg;
    document.getElementById('offline').style.display = 'flex';
  };
  setTimeout(function () {
    if (!window.permaSetScene) {
      window._pinglog('TIMEOUT: permaSetScene never registered after 8s');
      window.permaFatal(window.permaBootError ||
        '<b>3D viewer couldn\'t start</b><br>' +
        'The bundled 3D engine failed to load. The 2D map is unaffected.');
    }
  }, 8000);
  // Users can't see the devtools console — surface uncaught errors. Until the
  // viewer has booted (permaSetScene registered), show the REAL error in the
  // full-screen overlay instead of the generic "couldn't start" notice, so a
  // boot failure tells us exactly what broke.
  function _showViewerError(detail) {
    detail = String(detail);
    window._pinglog('error: ' + detail.slice(0, 300));
    console.error('[scene3d] ' + detail);   // → stderr via the host's log page
    var hud = document.getElementById('hud');
    if (hud) hud.innerHTML = '3D viewer error: ' + detail.slice(0, 200);
    if (!window.permaSetScene) {
      window.permaFatal('<b>3D viewer error</b><br>' + detail.slice(0, 400)
        + '<br><br>The 2D map is unaffected.');
    }
  }
  // capture = true so module/resource load failures (which don't bubble) are
  // caught too, not just thrown exceptions.
  window.addEventListener('error', function (e) {
    var d = (e && (e.message || (e.error && e.error.message)))
      || (e && e.target && (e.target.src || e.target.href)
          ? 'failed to load ' + (e.target.src || e.target.href) : 'unknown error');
    _showViewerError(d);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    _showViewerError((r && (r.message || r.stack)) || r || 'unhandled rejection');
  });
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
// If we got here the static three.js imports resolved & executed.
// Expose the vendored three.js API as globals so the ordered classic
// viewer chunks (html/scene3d/*.js) can use it without each being a
// module — a shared-global split like the 2D map's html/map/*.js.
window.THREE = THREE;
window.OrbitControls = OrbitControls;
window.mergeGeometries = mergeGeometries;
window.GLTFLoader = GLTFLoader;
window._pinglog && window._pinglog('module-eval-start (three OK)');
// Load the viewer chunks in order; each onload triggers the next so
// the global-scope declarations accumulate in the same order the old
// single script evaluated them.
(function () {
  const FILES = [
    'scene3d/01-core.js',
    // Surfaces + plantMaterial: before 02-plants because everything downstream
    // of it builds geometry that wants a material.
    'scene3d/01b-surface.js',
    'scene3d/02-plants.js',
    'scene3d/03-herbs.js',
    'scene3d/04-quality.js',
    'scene3d/05-flowers.js',
    'scene3d/06-fly.js',
    'scene3d/07-wildlife.js',
    'scene3d/08-modes.js',
    'scene3d/09-models.js',
    'scene3d/10-inspect.js',
    'scene3d/11-fruit.js',
    'scene3d/12-seedheads.js',
    'scene3d/13-stylised.js',
    'scene3d/14-layers.js',
    'scene3d/15-florets.js',
    // V2.43: click-to-plant in the reference sandboxes, and the QWebChannel
    // the viewer never had. Last on purpose — its pointer handlers must
    // register after 10-inspect.js's so both see the same click.
    'scene3d/16-editing.js',
    // V2.44: the tween registry and the plant / pull / catch animations.
    // 16-editing.js only calls into these at click time, long after every
    // chunk has loaded, so it does not need to load first.
    'scene3d/17-anim.js',
    'scene3d/18-flight.js',   // V2.45: real wingbeats (src/flight_model.py)
    // V2.46: the roster / labels / spotlight, split out of 07-wildlife.js when
    // life-size scaling and creature collision took it past its ceiling.
    'scene3d/19-roster.js',
    // V2.46b: the walker's body and his net, split out of 08-modes.js when the
    // held net took it past its ceiling. Nothing here is called from the
    // animation loop — see the load-order note in the file.
    'scene3d/20-walker.js',
    // V2.46d: the procedural creature bodies, split out of 07-wildlife.js when
    // the bird flight attitude took it past its ceiling. Nothing here is called
    // from the animation loop — see 08-modes.js:_loopFault.
    'scene3d/21-critters.js',
  ];
  let i = 0;
  (function next() {
    if (i >= FILES.length) { window._pinglog && window._pinglog('chunks loaded'); return; }
    const s = document.createElement('script');
    s.src = FILES[i++];
    s.onload = next;
    s.onerror = function () {
      window._showViewerError && window._showViewerError('failed to load ' + s.src);
    };
    document.head.appendChild(s);
  })();
})();
</script>
</body>
</html>
